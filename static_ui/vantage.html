<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stop Digging Through Dashboards</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Your metrics are scattered across a dozen dashboards. Vantage bring them into one clear signal, so every decision is backed by data you actually trust.">

  <!-- Instant Motion-Pending Initialization -->
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion-pending');
      window.__motionFallback = setTimeout(function() {
        document.documentElement.classList.remove('motion-pending');
      }, 3500);
    }
  </script>

  <style>
    /* ==========================================================================
       FONTS & GLOBAL RESET
       ========================================================================== */
    @font-face {
      font-family: "Reference Sans";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: local("Reference Sans"), local("ReferenceSans"),
           local("SF Pro Display"), local("-apple-system"),
           local("Segoe UI"), local("Helvetica Neue"), sans-serif;
    }

    @font-face {
      font-family: "Reference Display";
      font-style: normal;
      font-weight: 400 900;
      font-display: swap;
      src: local("Reference Display"), local("ReferenceDisplay"),
           local("Reference Sans"), local("Helvetica Neue"), sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      font-family: "Reference Sans", Arial, sans-serif;
      color-scheme: dark;
      background-color: #000;
      color: #fff;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================================================
       VIEWPORT & SCREEN ARCHITECTURE
       ========================================================================== */
    .viewport {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: #000;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;

      /* Desktop Exact Spacing & Typography Tokens */
      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --compact-control-font-size: clamp(17px, 1.75vh, 19px);
      --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
      --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
      --control-inline-nudge: -1px;
      --control-baseline-shift: clamp(1px, .19vh, 2px);
      --copy-optical-shift: clamp(0px, .1vh, 1px);
      --watch-baseline-shift: clamp(2px, .38vh, 4px);
      --card-width: clamp(150px, 18.96vh, 215px);
    }

    /* Cinematic Edge-to-Edge Background Video */
    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    /* Screen Vignette Overlay */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
        radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
    }

    /* ==========================================================================
       TOP HEADER (BRAND, NAV, TIME PANEL, SIGN UP)
       ========================================================================== */
    .header {
      position: absolute;
      inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
      height: 48px;
      display: flex;
      align-items: flex-start;
      white-space: nowrap;
      z-index: 10;
    }

    /* 25x25 SVG Disc Brand Logo */
    .brand {
      position: relative;
      top: 10px;
      width: 25px;
      height: 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
      outline: none;
    }

    .header-actions {
      display: flex;
      align-items: flex-start;
      flex: 1;
      margin-left: clamp(36px, 3.03vw, 48px);
    }

    /* Navigation Links */
    .nav {
      display: flex;
      align-items: center;
      gap: clamp(32px, 2.9vw, 43px);
      position: relative;
      top: 9px;
    }

    .nav-link {
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -.36px;
      color: rgba(229,229,230,.77);
      text-decoration: none;
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      position: relative;
      outline: none;
    }

    .nav-link:first-child {
      top: -3px;
    }

    .nav-link:nth-child(4) {
      margin-left: 1px;
    }

    .nav-link.active {
      color: #fff;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 44px;
      height: 2px;
      background: rgba(255,255,255,.82);
      border-radius: 1px;
    }

    /* Time Panel (Timezone) */
    .time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230,230,230,.52);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }

    .time-label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240,240,240,.77);
      line-height: 1.2;
      letter-spacing: -.2px;
    }

    .time-value {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255,255,255,.93);
      line-height: 1.2;
      letter-spacing: -.2px;
    }

    /* Header Sign Up Pill Button */
    .sign-up {
      width: 109px;
      height: 42px;
      border-radius: 7px;
      background: #fff;
      color: #101010;
      font-size: 15px;
      font-weight: 460;
      letter-spacing: -.34px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34);
      margin-left: clamp(20px, 1.95vw, 29px);
      position: relative;
      top: 3px;
      font-family: inherit;
    }

    /* Mobile/Tablet Menu Toggle (Hidden on Desktop) */
    .menu-toggle {
      display: none;
    }

    /* ==========================================================================
       HERO (BOTTOM-LEFT CONTENT STACK)
       ========================================================================== */
    .hero {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero-content {
      position: absolute;
      left: var(--gutter-start);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 5;
      pointer-events: auto;
    }

    /* Headline */
    .hero-title {
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-size: var(--display-size);
      line-height: var(--display-leading);
      font-weight: 500;
      font-optical-sizing: auto;
      letter-spacing: -2.1px;
      -webkit-text-stroke: .12px currentColor;
      white-space: nowrap;
      text-shadow: 0 2px 2px rgba(0,0,0,.44);
      margin: 0;
      padding: 0;
    }

    .line {
      display: block;
      overflow: hidden;
      transform-origin: left center;
    }

    .line-one {
      color: #fff;
      transform: scaleX(.775);
    }

    .line-two {
      color: rgba(211, 207, 207, .78);
      transform: scaleX(.793);
    }

    .line-reveal {
      display: inline-block;
      will-change: transform;
    }

    /* Hero Body Copy */
    .hero-copy {
      margin-top: var(--title-copy-gap);
      color: rgba(226, 229, 228, .84);
      font-size: var(--copy-size);
      line-height: var(--copy-leading);
      font-weight: 350;
      letter-spacing: .13px;
      width: clamp(390px, 31.67vw, 500px);
      position: relative;
      left: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
    }

    /* Primary CTA Button */
    .primary-cta {
      margin-top: var(--copy-cta-gap);
      width: var(--cta-width);
      height: var(--cta-height);
      border-radius: 7px;
      background: #fff;
      color: #111;
      box-shadow: 0 1px 5px rgba(0,0,0,.38);
      border: none;
      cursor: pointer;
      position: relative;
      display: inline-flex;
      align-items: center;
      font-family: inherit;
    }

    .primary-cta .label {
      position: absolute;
      left: 8.125%;
      font-size: var(--primary-control-font-size);
      font-weight: 450;
      letter-spacing: -.3px;
      color: #111;
    }

    .primary-cta .arrow-box {
      position: absolute;
      right: 3.125%;
      top: 14.286%;
      width: 20.625%;
      height: 71.429%;
      border-radius: 7px;
      background: #070909;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       DEMO CARD (BOTTOM-RIGHT GLASS COMPONENT)
       ========================================================================== */
    .demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201 / 265;
      container-type: inline-size;
      z-index: 5;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3.5cqw;

      /* Exact Glass Look */
      border: 1px solid rgba(255,255,255,.13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
      box-shadow:
        0 2px 10px rgba(0,0,0,.44),
        0 0 0 3px rgba(255,255,255,.035) inset,
        0 0 0 1px rgba(0,0,0,.9);
      backdrop-filter: blur(14px) saturate(108%);
      -webkit-backdrop-filter: blur(14px) saturate(108%);
    }

    .demo-visual {
      position: relative;
      width: 92.5cqw;
      height: 92cqw;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .demo-visual img,
    .demo-visual svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.89) saturate(.93) contrast(1.03);
    }

    .play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 29cqw;
      height: 29cqw;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(3,5,7,.47);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding-left: 2.5cqw;
    }

    .watch-button {
      width: 100%;
      height: 17cqw;
      border-radius: 3cqw;
      border: 1px solid rgba(255,255,255,.21);
      background: linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
      color: #fff;
      font-size: 8.5cqw;
      font-weight: 430;
      letter-spacing: -.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      margin-top: auto;
      font-family: inherit;
    }

    /* ==========================================================================
       ENTRANCE MOTION & CHOREOGRAPHY
       ========================================================================== */
    @keyframes entrance-brand {
      from { opacity: 0; transform: translate3d(0, 7px, 0) scale(.94); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    @keyframes entrance-nav {
      from { opacity: 0; transform: translate3d(0, 6px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes entrance-action {
      from { opacity: 0; transform: translate3d(0, 8px, 0) scale(.985); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    @keyframes entrance-line {
      from { transform: translate3d(0, 110%, 0) skewY(2deg); }
      to { transform: translate3d(0, 0, 0) skewY(0deg); }
    }

    @keyframes entrance-copy {
      from { opacity: 0; transform: translate3d(0, 10px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @keyframes entrance-card {
      from { opacity: 0; transform: translate3d(0, 12px, 0) scale(.968); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    html.motion-pending .brand {
      opacity: 0;
      animation: entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms forwards;
    }

    html.motion-pending .nav-link:nth-child(1) {
      opacity: 0;
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 130ms forwards;
    }

    html.motion-pending .nav-link:nth-child(2) {
      opacity: 0;
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 175ms forwards;
    }

    html.motion-pending .nav-link:nth-child(3) {
      opacity: 0;
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }

    html.motion-pending .nav-link:nth-child(4) {
      opacity: 0;
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 265ms forwards;
    }

    html.motion-pending .time-panel {
      opacity: 0;
      animation: entrance-nav 520ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }

    html.motion-pending .sign-up {
      opacity: 0;
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }

    html.motion-pending .menu-toggle {
      opacity: 0;
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms forwards;
    }

    html.motion-pending .line-one .line-reveal {
      transform: translate3d(0, 110%, 0) skewY(2deg);
      animation: entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms forwards;
    }

    html.motion-pending .line-two .line-reveal {
      transform: translate3d(0, 110%, 0) skewY(2deg);
      animation: entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms forwards;
    }

    html.motion-pending .hero-copy {
      opacity: 0;
      animation: entrance-copy 620ms cubic-bezier(.16,1,.3,1) 740ms forwards;
    }

    html.motion-pending .primary-cta {
      opacity: 0;
      animation: entrance-action 560ms cubic-bezier(.16,1,.3,1) 960ms forwards;
    }

    html.motion-pending .demo-card {
      opacity: 0;
      transform-origin: 82% 50%;
      animation: entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms forwards;
    }

    /* Hover & Focus Interactions */
    @media (prefers-reduced-motion: no-preference) {
      button, a {
        transition: filter 140ms ease, opacity 140ms ease, transform 140ms ease;
      }
      button:hover, a:hover {
        filter: brightness(1.08);
      }
      .play:hover {
        transform: translate(-50%, -50%) scale(1.06);
        filter: brightness(1.15);
      }
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* ==========================================================================
       RESPONSIVE ADAPTATIONS (TABLET & MOBILE)
       ========================================================================== */
    @media (min-width: 620px) and (max-width: 790px),
           (min-width: 620px) and (max-width: 1100px) and (orientation: portrait) {
      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 11px;
        border: 1px solid rgba(255, 255, 255, .18);
        background: linear-gradient(145deg, rgba(24, 22, 20, .80), rgba(5, 12, 14, .86));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: #fff;
        cursor: pointer;
        margin-left: auto;
        z-index: 20;
      }

      .header-actions {
        position: absolute;
        top: 56px;
        right: 0;
        width: min(324px, calc(100vw - 2 * var(--gutter-end)));
        flex-direction: column;
        align-items: stretch;
        background: linear-gradient(145deg, rgba(20, 18, 16, .92), rgba(6, 12, 14, .95));
        border: 1px solid rgba(255, 255, 255, .15);
        border-radius: 16px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .7);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity 220ms ease, transform 220ms ease, visibility 220ms ease;
        margin-left: 0;
        z-index: 15;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        top: 0;
      }

      .time-panel {
        margin-left: 0;
        margin-top: 18px;
        padding-top: 14px;
        padding-left: 0;
        border-left: none;
        border-top: 1px solid rgba(255, 255, 255, .12);
        width: 100%;
        height: auto;
      }

      .sign-up {
        margin-left: 0;
        margin-top: 16px;
        width: 100%;
        top: 0;
      }
    }

    @media (max-width: 619px) {
      :root {
        --mobile-gutter: clamp(16px, 5vw, 24px);
        --gutter-start: var(--mobile-gutter);
        --gutter-end: var(--mobile-gutter);
        --header-top: 16px;
        --hero-bottom: 24px;
        --display-size: clamp(34px, 9vw, 48px);
        --display-leading: clamp(42px, 10.5vw, 56px);
        --card-width: clamp(110px, 32vw, 140px);
      }

      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, .18);
        background: linear-gradient(145deg, rgba(24, 22, 20, .80), rgba(5, 12, 14, .86));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        color: #fff;
        cursor: pointer;
        margin-left: auto;
        z-index: 20;
      }

      .header-actions {
        position: absolute;
        top: 52px;
        right: 0;
        width: min(340px, calc(100vw - 2 * var(--mobile-gutter)));
        flex-direction: column;
        align-items: stretch;
        background: linear-gradient(145deg, rgba(20, 18, 16, .94), rgba(6, 12, 14, .96));
        border: 1px solid rgba(255, 255, 255, .15);
        border-radius: 16px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .75);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity 220ms ease, transform 220ms ease, visibility 220ms ease;
        margin-left: 0;
        z-index: 15;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .nav {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        top: 0;
      }

      .time-panel {
        margin-left: 0;
        margin-top: 16px;
        padding-top: 12px;
        padding-left: 0;
        border-left: none;
        border-top: 1px solid rgba(255, 255, 255, .12);
        width: 100%;
        height: auto;
      }

      .sign-up {
        margin-left: 0;
        margin-top: 14px;
        width: 100%;
        top: 0;
      }

      .hero-title .line-one {
        transform: scaleX(.78);
      }

      .hero-title .line-two {
        transform: scaleX(.55);
      }

      .hero-copy br {
        display: none;
      }

      .hero-copy {
        width: 100%;
        max-width: 340px;
      }

      .demo-card {
        top: clamp(176px, 32svh, 300px);
        bottom: auto;
      }
    }

    /* Menu Hamburger Icon State Transitions */
    .menu-icon line {
      transition: transform 200ms ease, opacity 200ms ease;
      transform-origin: center;
    }
    .header.menu-open .menu-icon .line-top {
      transform: translateY(3.5px) rotate(45deg);
    }
    .header.menu-open .menu-icon .line-bottom {
      transform: translateY(-3.5px) rotate(-45deg);
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="screen" id="screen">
      <!-- Mandatory Exact CloudFront Background Video -->
      <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_064556_051587f1-74a1-4336-8c05-4dde3594ed05.mp4" type="video/mp4">
      </video>

      <!-- Top Header Navigation Bar -->
      <header class="header">
        <a href="#" class="brand" aria-label="Vantage home">
          <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="brand-disc">
                <circle cx="12.5" cy="12.5" r="12.5" />
              </clipPath>
            </defs>
            <g clip-path="url(#brand-disc)">
              <rect width="25" height="25" fill="#ededed" />
              <path d="M12.5 2.5L22.5 12.5L12.5 22.5L2.5 12.5Z" fill="#050606" />
              <path d="M12.5 5L20 12.5L12.5 20L5 12.5Z" fill="#737778" />

  <script>
    // Animation Completion Cleanup
    const demoCard = document.querySelector('.demo-card');
    if (demoCard) {
      demoCard.addEventListener('animationend', function() {
        document.documentElement.classList.remove('motion-pending');
        if (window.__motionFallback) clearTimeout(window.__motionFallback);
      });
    }

    // Responsive Mobile/Tablet Menu Controller
    const header = document.querySelector('.header');
    const menuToggle = document.querySelector('.menu-toggle');
    const tabletNav = document.getElementById('tablet-navigation');

    if (menuToggle && header) {
      menuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = header.classList.toggle('menu-open');
        menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if (tabletNav) {
          if (isOpen) {
            tabletNav.removeAttribute('inert');
            const firstLink = tabletNav.querySelector('a, button');
            if (firstLink) firstLink.focus();
          } else {
            tabletNav.setAttribute('inert', '');
          }
        }
      });

      // Close menu on click outside or Escape
      document.addEventListener('click', function(e) {
        if (header.classList.contains('menu-open') && !header.contains(e.target)) {
          header.classList.remove('menu-open');
          menuToggle.setAttribute('aria-expanded', 'false');
          if (tabletNav) tabletNav.setAttribute('inert', '');
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && header.classList.contains('menu-open')) {
          header.classList.remove('menu-open');
          menuToggle.setAttribute('aria-expanded', 'false');
          if (tabletNav) tabletNav.setAttribute('inert', '');
          menuToggle.focus();
        }
      });
    }
  </script>
</body>
